<body>
    <div class="background-glow"></div>

    <header class="topbar">
        <a class="brand" href="index.html"><span class="brand-mark"></span><span class="grad-text">QODE</span></a>
        <nav class="tabs" aria-label="Main">
            <a class="tab" href="index.html">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/></svg>
                Home
            </a>
            <a class="tab active" href="generator.html" aria-current="page">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg>
                Create
            </a>
            <a class="tab" href="scanner.html">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8V6a2 2 0 0 1 2-2h2M16 4h2a2 2 0 0 1 2 2v2M20 16v2a2 2 0 0 1-2 2h-2M8 20H6a2 2 0 0 1-2-2v-2"/><path d="M7 12h10"/></svg>
                Scan
            </a>
        </nav>
    </header>

    <main class="page">
        <div class="gen-layout">
            <section class="gen-controls">
                <div>
                    <h1 class="title">Design<span class="dot">.</span></h1>
                    <p class="lede">Type text or a link. Your Qode updates as you type.</p>
                </div>

                <div class="field">
                    <label for="qode-text">Content <small id="char-count"></small></label>
                    <textarea id="qode-text" class="input" rows="2" maxlength="120" placeholder="Text or a link…">https://qode.sherin.fun</textarea>
                </div>

                <div class="field">
                    <label>Strength <small id="strength-hint">Balanced</small></label>
                    <div class="segmented" id="strength" role="radiogroup" aria-label="Strength">
                        <span class="thumb"></span>
                        <button type="button" data-ecc="1" role="radio">Light</button>
                        <button type="button" data-ecc="2" role="radio" class="active">Balanced</button>
                        <button type="button" data-ecc="3" role="radio">Strong</button>
                    </div>
                    <input type="hidden" id="qode-ecc" value="2">
                    <p class="hint" id="strength-text">Each digit is stored three times, so scuffs and glare are no problem.</p>
                </div>

                <div class="gen-actions">
                    <button id="save-btn" class="btn btn-primary btn-lg">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg>
                        <span>Save image</span>
                    </button>
                    <a class="btn btn-ghost btn-lg" href="scanner.html">Scan it</a>
                </div>
            </section>

            <section class="gen-preview">
                <div class="stage" id="stage">
                    <div class="orbit-glow"></div>
                    <div class="orbit-ring"></div>
                    <img id="qode-image" class="qode-img hidden" alt="Your Qode" width="500" height="500">
                    <div class="spinner"></div>
                </div>
            </section>
        </div>
    </main>

    <script src="app.js?v=9"></script>
</body>

</html>
