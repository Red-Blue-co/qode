    <main class="page">
        <div class="scan-layout">
            <section class="scan-side">
                <div class="scan-head">
                    <h1 class="title">Decode<span class="dot">.</span></h1>
                    <p class="lede">Point your camera at a Qode. It reads live, right on your device.</p>
                </div>

                <div class="segmented" role="tablist" aria-label="Scan from">
                    <span class="thumb"></span>
                    <button id="mode-camera" class="mode-btn active" role="tab">Camera</button>
                    <button id="mode-upload" class="mode-btn" role="tab">Upload</button>
                </div>

                <div id="result-box" class="result card hidden" aria-live="polite">
                    <div class="result-head">
                        <span class="result-label">Decoded</span>
                        <span id="result-kind" class="chip">Text</span>
                    </div>
                    <div id="scan-result" class="result-text"></div>
                    <div class="result-actions">
                        <a id="open-btn" class="btn btn-primary hidden" target="_blank" rel="noopener noreferrer">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg>
                            Open link
                        </a>
                        <button id="copy-btn" class="btn btn-ghost">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V5a1 1 0 0 0-1-1H5a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h3"/></svg>
                            <span>Copy</span>
                        </button>
                        <button id="scan-btn" class="btn btn-ghost">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12a8 8 0 0 1 14-5.3L20 9M20 4v5h-5M20 12a8 8 0 0 1-14 5.3L4 15M4 20v-5h5"/></svg>
                            <span>Scan again</span>
                        </button>
                    </div>
                </div>
            </section>

            <section class="scan-stage">
                <div class="lens" id="lens">
                    <div class="lens-halo"></div>
                    <div class="lens-ring"></div>
                    <div class="lens-draw"></div>

                    <div id="camera-view" class="scanner-container active">
                        <video id="video-feed" playsinline muted></video>
                        <svg class="reticle" viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="34" pathLength="360" /></svg>
                        <!-- Outline that follows the code -->
                        <canvas id="track-overlay" class="track-overlay" aria-hidden="true"></canvas>
                        <img id="scan-snap-preview" class="hidden" alt="The frame the Qode was read from">
                        <div class="burst"></div>
                        <div class="glint"></div>
                        <div class="check"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>
                        <canvas id="capture-canvas" hidden></canvas>
                    </div>

                    <div id="upload-view" class="scanner-container">
                        <label class="dropzone" id="dropzone">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="3"/><circle cx="9" cy="10" r="2"/><path d="M21 16l-5-5-8 8"/></svg>
                            <strong>Choose a photo</strong>
                            <span>or drop a screenshot of a Qode here</span>
                            <input type="file" id="file-input" accept="image/*" hidden>
                        </label>
                        <img id="uploaded-preview" class="hidden" alt="Your photo">
                        <div class="burst"></div>
                        <div class="glint"></div>
                        <button id="change-photo" class="btn btn-ghost change-photo hidden">Choose another</button>
                    </div>
                </div>

                <div class="status" id="status" data-state="idle">
                    <span class="status-dot"></span>
                    <span id="scan-status">Starting camera…</span>
                </div>
            </section>
        </div>
    </main>

    <script src="app.js?v=10"></script>
